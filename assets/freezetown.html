<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Freezetown Backgrounds</title>
<style>
:root{--bg:#070a14;--card:#0d1220;--line:#1c2438;--fg:#e4eaf6;--muted:#97a3bd;--dim:#66728d;--acc:#8fd3ff;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.5;padding:28px 16px 48px;overflow-x:hidden}
header,main{max-width:1440px;margin-inline:auto}
header{margin-bottom:24px}
h1{font-size:clamp(24px,4vw,34px);font-weight:650;letter-spacing:.01em;margin:0 0 6px}
header p{margin:0;color:var(--muted);max-width:72ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));gap:20px}
figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
canvas{display:block;width:100%;aspect-ratio:16/9;background:#03050c}
figcaption{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px}
.t{display:flex;align-items:baseline;gap:10px;min-width:0}
.n{font-variant-numeric:tabular-nums;color:var(--acc);font-size:13px;font-weight:600;letter-spacing:.06em;opacity:.8}
h2{font-size:16px;font-weight:600;margin:0;overflow-wrap:anywhere}
figcaption p{margin:0;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<header>
<h1>Freezetown Backgrounds</h1>
<p>Eight painted night scenes for the snowy Freezetown biome, each drawn live at 960&times;540 by the canvas engine below, with falling snow at three depths, drifting mist and soft moonlight, aurora and lantern glow.</p>
</header>
<main><div class="grid" id="grid"></div></main>
<script>
/* ===== Freezetown paintings: snowy night backgrounds for the FREEZETOWN biome (deep night blues, icy cyan, lavender, white snow and pale moonlight; warm amber only for village lights and fires) ===== */
const FROST=(()=>{
const W=960,H=540,TAU=Math.PI*2,FY=470;

let c=null;
let seed=1;const R=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};const rr=(a,b)=>a+R()*(b-a);
const lg=(x0,y0,x1,y1,st)=>{const g=c.createLinearGradient(x0,y0,x1,y1);st.forEach((s,i)=>g.addColorStop(i/(st.length-1),s));return g};
const rg=(x,y,r0,r1,st)=>{const g=c.createRadialGradient(x,y,r0,x,y,r1);st.forEach((s,i)=>g.addColorStop(i/(st.length-1),s));return g};
/* linear gradient with explicit stop positions: st=[[pos,colour],...] */
const lgp=(x0,y0,x1,y1,st)=>{const g=c.createLinearGradient(x0,y0,x1,y1);st.forEach(s=>g.addColorStop(s[0],s[1]));return g};
const P2=()=>new Path2D();
const blob=(pts,p)=>{p=p||P2();const n=pts.length;for(let i=0;i<=n;i++){const a=pts[i%n],q=pts[(i+1)%n],mx=(a[0]+q[0])/2,my=(a[1]+q[1])/2;i?p.quadraticCurveTo(a[0],a[1],mx,my):p.moveTo(mx,my)}p.closePath();return p};
const rock=(cx,cy,rx,ry,j,n)=>{const pts=[];n=n||11;for(let i=0;i<n;i++){const a=i/n*TAU,k=1+rr(-j,j);pts.push([cx+Math.cos(a)*rx*k,cy+Math.sin(a)*ry*k])}return pts};
const add=(f)=>{c.save();c.globalCompositeOperation='lighter';f();c.restore()};
const A=(r,g,b,a)=>'rgba('+(r|0)+','+(g|0)+','+(b|0)+','+(a===undefined?1:a)+')';
/* B(v,a): the cold ramp, deep night blue at low v rising to lavender-white at high v */
const B=(v,a)=>A(v*(.42+.55*v/255),v*(.58+.4*v/255),Math.min(255,v),a);
const SN=(a)=>A(232,238,252,a),MN=(a)=>A(236,240,255,a),IC=(a)=>A(130,215,255,a),LV=(a)=>A(176,164,228,a),AM=(a)=>A(255,178,92,a),WN=(a)=>A(255,214,148,a);
const poly=(p,pts)=>{p.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)p.lineTo(pts[i][0],pts[i][1]);p.closePath();return p};
const seg=(p,a,b)=>{p.moveTo(a[0],a[1]);p.lineTo(b[0],b[1])};
const mod=(a,m)=>((a%m)+m)%m;
/* soft ellipse from a unit radial gradient */
const ell=(g,x,y,rx,ry,a)=>{c.globalAlpha=a;c.fillStyle=g;c.save();c.translate(x,y);c.scale(rx,ry);c.beginPath();c.arc(0,0,1,0,TAU);c.fill();c.restore()};
const crack=(p,x,y,ang,len,br)=>{p.moveTo(x,y);let l=0;while(l<len){const s=rr(6,16);ang+=rr(-.5,.5);x+=Math.cos(ang)*s;y+=Math.sin(ang)*s;p.lineTo(x,y);l+=s;if(br>0&&R()<.18){crack(p,x,y,ang+rr(-1,1),len*.4,br-1);p.moveTo(x,y)}}};
/* tapered icicle hanging from (x,y), added to p */
const icicle=(p,x,y,w,l,bend)=>{bend=bend||0;p.moveTo(x-w/2,y);p.quadraticCurveTo(x-w*.3,y+l*.5,x+bend,y+l);p.quadraticCurveTo(x+w*.3,y+l*.5,x+w/2,y);p.closePath()};

/* cached generic gradients (shape only; strength comes from globalAlpha) */
let FOG=null,DOT=null,WARM=null,CYG=null,SHD=null,VIG=null,FLOOR=null;
function caches(){if(FOG)return;FOG=rg(0,0,0,1,[A(196,210,240,1),A(170,186,228,.45),A(150,166,214,0)]);DOT=rg(0,0,0,1,[MN(1),MN(.25),MN(0)]);
 WARM=rg(0,0,0,1,[A(255,222,160,1),A(255,158,70,.32),A(255,110,40,0)]);CYG=rg(0,0,0,1,[A(200,248,255,1),A(90,190,255,.3),A(50,120,255,0)]);SHD=rg(0,0,0,1,[A(14,20,60,.7),A(14,20,60,.28),A(14,20,60,0)]);
 VIG=rg(W/2,H*.48,H*.3,W*.72,[A(2,4,16,0),A(2,4,16,.3),A(1,2,10,.74)]);
 FLOOR=lgp(0,FY-44,0,H,[[0,A(8,14,34,0)],[.35,A(8,14,34,.5)],[.6,A(6,10,28,.86)],[1,A(4,7,20,.96)]])}

/* =================== shared painting helpers =================== */
/* snowy pine: tiers of drooping boughs added to p, the moonlit snow shelves on each tier added to s */
function pine(p,s,x,y,h,w){const n=Math.max(3,Math.min(7,Math.round(h/(h<40?12:22)))),top=y-h;
 p.rect(x-w*.04,y-h*.15,w*.08,h*.17);
 for(let i=0;i<n;i++){const k0=i/n,k1=(i+1)/n,yt=top+h*(.86*k0-(i?.07:0)),yb=top+h*(.12+.8*k1),hw=w*.5*(.22+.78*k1)*rr(.86,1.1),dy=yb-yt;
  if(h<50){poly(p,[[x,yt],[x-hw,yb],[x-hw*.3,yb-dy*.08],[x+hw*.3,yb-dy*.08],[x+hw,yb]]);if(s)poly(s,[[x,yt],[x-hw*.9,yb-dy*.06],[x-hw*.2,yb-dy*.32],[x+hw*.55,yb-dy*.2]]);continue}
  p.moveTo(x,yt);p.quadraticCurveTo(x-hw*.3,yt+dy*.55,x-hw,yb);
  const m=h<40?1:Math.max(2,Math.round(hw/11));for(let j=1;j<=m;j++){const xa=x-hw+2*hw*(j-.5)/m,xb=x-hw+2*hw*j/m;p.quadraticCurveTo(xa,yb+dy*.12,xb,yb-(j<m?dy*.06:0))}
  p.quadraticCurveTo(x+hw*.3,yt+dy*.55,x,yt);p.closePath();
  if(s){s.moveTo(x,yt);s.quadraticCurveTo(x-hw*.3,yt+dy*.52,x-hw*.95,yb-dy*.04);s.quadraticCurveTo(x-hw*.62,yb-dy*.2,x-hw*.3,yb-dy*(.26+rr(-.05,.05)));
   s.quadraticCurveTo(x,yb-dy*.42,x+hw*.35,yb-dy*.24);s.quadraticCurveTo(x+hw*.62,yb-dy*.12,x+hw*.84,yb-dy*.14);s.quadraticCurveTo(x+hw*.24,yt+dy*.45,x,yt);s.closePath()}}}
/* a row of pines along a base line; gap(x) leaves clearings */
function forest(x0,x1,base,hmin,hmax,dens,gap){const p=P2(),s=P2();let x=x0;while(x<x1){const h=rr(hmin,hmax);if(!gap||!gap(x))pine(p,s,x,base+rr(-3,3),h,h*rr(.38,.5));x+=h*rr(.16,.4)/dens}return {p,s}}
/* a far treeline: one zigzag of pine silhouettes (cheap straight lines), tiny snow caps on the tips added to s */
function treeline(x0,x1,base,hmin,hmax,gap){const p=P2(),s=P2();p.moveTo(x0,base+4);let x=x0;while(x<x1){const h=rr(hmin,hmax),w=h*rr(.42,.56);if(gap&&gap(x)){x+=w;p.lineTo(x,base+4);continue}const y=base+rr(-2,2);
  p.lineTo(x,y);p.lineTo(x+w*.3,y-h*.45);p.lineTo(x+w*.22,y-h*.47);p.lineTo(x+w*.5,y-h);p.lineTo(x+w*.78,y-h*.47);p.lineTo(x+w*.7,y-h*.45);p.lineTo(x+w,y);
  poly(s,[[x+w*.5,y-h],[x+w*.34,y-h*.68],[x+w*.48,y-h*.74],[x+w*.64,y-h*.7]]);poly(s,[[x+w*.25,y-h*.46],[x+w*.08,y-h*.12],[x+w*.4,y-h*.3]]);x+=w*rr(.5,.95)}
 p.lineTo(x1,base+4);p.closePath();return {p,s}}
/* rolling snow ground: wavy top edge from x0 to x1, closed down to y1 */
function hill(y,amp,y1,n,ph){const p=P2(),f=rr(.004,.007);p.moveTo(-20,y1);for(let x=-20;x<=W+20;x+=20)p.lineTo(x,y+Math.sin(x*f+ph)*amp+Math.sin(x*f*2.7+ph*1.7)*amp*.35);p.lineTo(W+20,y1);p.closePath();return p}
/* a mountain range: jagged ridge (midpoint displacement), snow caps, and the faces turned away from the light in shadow (lit=1: light from the left) */
function range(x0,x1,base,yHi,yLo,n,capD,lit){const ctrl=[[x0,base-(base-yLo)*.3]],pk=[];
 for(let i=0;i<n;i++){const x=x0+(x1-x0)*(i+rr(.3,.7))/n,y=rr(yHi,yLo),q=ctrl[ctrl.length-1];
  if(i){const px=pk[i-1],vy=Math.min(base-8,Math.max(px[1],y)+rr(.2,.45)*(x-px[0]));ctrl.push([(px[0]+x)/2+rr(-.12,.12)*(x-px[0]),vy])}
  pk.push([x,y]);ctrl.push([x,y])}
 ctrl.push([x1,base-(base-yLo)*.3]);
 let pts=ctrl;for(let it=0;it<4;it++){const o=[];for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1],d=Math.abs(b[0]-a[0]);o.push(a,[(a[0]+b[0])/2+rr(-.06,.06)*d,(a[1]+b[1])/2+rr(-.2,.2)*d])}o.push(pts[pts.length-1]);pts=o}
 const M={p:P2(),cap:P2(),sh:P2(),base,top:yHi};M.p.moveTo(x0,H);pts.forEach(q=>M.p.lineTo(q[0],q[1]));M.p.lineTo(x1,H);M.p.closePath();
 for(let k=0;k<n;k++){const pi=(1+2*k)*16,P=pts[pi];if(!P)continue;const ys=P[1]+capD*rr(.6,1.3);let j=pi,e=pi;while(j>0&&pts[j-1][1]<ys)j--;while(e<pts.length-1&&pts[e+1][1]<ys)e++;
  const cp=pts.slice(j,e+1),m=Math.max(3,Math.round((pts[e][0]-pts[j][0])/9));for(let i=1;i<m;i++)cp.push([pts[e][0]+(pts[j][0]-pts[e][0])*i/m,ys+rr(-6,6)+(R()<.3?rr(8,26):0)]);poly(M.cap,cp);
  const dir=lit>0?1:-1;let v=pi;while(v+dir>0&&v+dir<pts.length-1&&Math.abs(v-pi)<16&&!(pts[v+dir][1]<pts[v][1]-4&&Math.abs(v-pi)>3))v+=dir;
  const sp=pts.slice(Math.min(pi,v),Math.max(pi,v)+1);if(dir<0)sp.reverse();const cx=P[0]+dir*rr(2,14);sp.push([pts[v][0],H],[cx+dir*rr(0,30),H],[cx,P[1]+(H-P[1])*.4]);poly(M.sh,sp)}
 return M}
function drawRange(M,col,cap,shA,hz){c.fillStyle=hz||col;c.fill(M.p);c.fillStyle=cap;c.fill(M.cap);c.fillStyle=lg(0,M.top,0,M.base,[A(10,16,48,shA),A(10,16,48,shA*.5),A(10,16,48,0)]);c.fill(M.sh)}
/* stars, the moon, aurora curtains */
function stars(S,t){const ps=[P2(),P2(),P2(),P2(),P2()];for(const s of S.stars){const a=s[4]*(.55+.45*Math.sin(t*s[5]+s[3]));ps[Math.min(4,(a*5)|0)].rect(s[0],s[1],s[2],s[2])}
 add(()=>{c.fillStyle=MN(1);for(let k=0;k<5;k++){c.globalAlpha=(k+.6)/5;c.fill(ps[k])}})}
function moon(x,y,r,t,k){k=k||1;add(()=>{ell(DOT,x,y,r*6,r*6,.15*k);ell(DOT,x,y,r*3.4,r*3.4,.5*k)});
 c.fillStyle=rg(x-r*.3,y-r*.3,r*.1,r*1.05,[A(250,252,255),A(226,232,250),A(190,198,232)]);c.beginPath();c.arc(x,y,r,0,TAU);c.fill();
 c.fillStyle=A(160,170,214,.38);c.beginPath();c.arc(x-r*.28,y-r*.12,r*.22,0,TAU);c.arc(x+r*.25,y+r*.3,r*.16,0,TAU);c.arc(x+r*.18,y-r*.38,r*.1,0,TAU);c.arc(x-r*.05,y+r*.5,r*.09,0,TAU);c.fill()}
function mkAurora(list){return list.map(b=>Object.assign({g:lgp(0,0,0,1,[[0,A(b.c[0],b.c[1],b.c[2],0)],[.55,A(b.c[0],b.c[1],b.c[2],.22)],[.88,A(b.c[0],b.c[1],b.c[2],.85)],[1,A(b.c[0],b.c[1],b.c[2],0)]])},b))}
function aurora(list,t){add(()=>{for(const b of list){const st=b.st||9;for(let x=b.x0;x<b.x1;x+=st){const u=(x-b.x0)/(b.x1-b.x0),env=Math.sin(u*Math.PI),
   y=b.y+Math.sin(x*.0055+t*b.sp+b.ph)*b.amp+Math.sin(x*.016-t*b.sp*1.6+b.ph*2)*b.amp*.32,h=b.h*(.55+.45*Math.sin(x*.009+t*.23+b.ph))*(.5+.5*env);
   c.globalAlpha=.56*b.a*env*(.5+.5*Math.sin(x*.045+t*.9+b.ph)*Math.sin(x*.013-t*.4));if(c.globalAlpha<=.01)continue;c.fillStyle=b.g;c.save();c.translate(x-st*.45,y-h);c.scale(st*1.9,h);c.fillRect(0,0,1,1);c.restore()}}})}
/* glints on snow and ice */
function glints(list,t){add(()=>{c.fillStyle=MN(1);for(const g of list){const s=Math.sin(t*g[3]+g[2]);if(s<.86)continue;const k=(s-.86)/.14;c.globalAlpha=k*.9;const r=g[4]*k;c.fillRect(g[0]-r,g[1]-.5,r*2,1);c.fillRect(g[0]-.5,g[1]-r,1,r*2)}})}
const mkGlints=(n,x0,x1,y0,y1)=>Array.from({length:n},()=>[rr(x0,x1),rr(y0,y1),rr(0,TAU),rr(.6,1.6),rr(2,4.5)]);
/* drifting cloud puffs */
const mkClouds=(n,y0,y1,a0,a1,sp)=>{const out=[];for(let i=0;i<n;i++){const w=rr(110,220);out.push({x:rr(0,W+400),y:rr(y0,y1),s:rr(2,6)*(sp||1),a:rr(a0,a1),pf:Array.from({length:5},()=>[rr(-w,w),rr(-12,10),rr(50,110),rr(14,30)])})}return out};
function clouds(list,t){add(()=>{c.fillStyle=FOG;for(const k of list){const x=mod(k.x+t*k.s,W+400)-200;c.globalAlpha=k.a;for(const p of k.pf){c.save();c.translate(x+p[0],k.y+p[1]);c.scale(p[2],p[3]);c.beginPath();c.arc(0,0,1,0,TAU);c.fill();c.restore()}}})}
/* wind gusts: thin bright streaks racing over the snow */
const mkGusts=(n,y0,y1,v0,v1)=>Array.from({length:n},()=>({x:rr(0,W),y:rr(y0,y1),l:rr(60,220),v:rr(v0,v1),ph:rr(0,TAU),a:rr(.1,.24)}));
function gusts(list,t){add(()=>{c.lineCap='round';c.lineWidth=1.6;c.strokeStyle=SN(1);for(const g of list){const x=mod(g.x+t*g.v,W+g.l*2)-g.l,y=g.y+Math.sin(t*.7+g.ph)*6;
  c.globalAlpha=g.a*(.6+.4*Math.sin(t*1.3+g.ph));c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+g.l*.5,y+Math.sin(t*2.1+g.ph)*5,x+g.l,y-2);c.stroke()}})}
/* warm window: glow, pane gradient, mullions */
function windowLit(x,y,w,h,t,ph,k){const fl=(.9+.06*Math.sin(t*1.9+ph)+.04*Math.sin(t*7.3+ph*2))*(k||1);
 add(()=>{ell(WARM,x+w/2,y+h/2,w*2.6,h*2.2,.32*fl)});c.fillStyle=lg(0,y,0,y+h,[WN(fl),AM(.95*fl)]);c.fillRect(x,y,w,h);
 c.fillStyle=A(30,20,30,.9);c.fillRect(x+w/2-1,y,2,h);c.fillRect(x,y+h*.45,w,2);c.strokeStyle=A(20,16,28);c.lineWidth=2;c.strokeRect(x,y,w,h)}
/* street lamp with a warm lantern, light cone and a pool on the snow */
function lampPost(x,base,h,t,ph){const y=base-h,fl=.9+.06*Math.sin(t*2.3+ph)+.04*Math.sin(t*8.1+ph*2);
 add(()=>{c.globalAlpha=.07*fl;c.fillStyle=WN(1);c.beginPath();c.moveTo(x-6,y-8);c.lineTo(x+6,y-8);c.lineTo(x+70,base);c.lineTo(x-70,base);c.closePath();c.fill();ell(WARM,x,base+2,90,12,.35*fl)});
 c.fillStyle=A(10,12,26);c.fillRect(x-2.5,y,5,h);c.fillRect(x-6,base-10,12,10);c.fillRect(x-8,y-2,16,4);c.fillRect(x-7,y-6,14,4);
 c.fillStyle=lg(0,y-26,0,y-6,[WN(fl),AM(fl)]);c.fillRect(x-6,y-26,12,20);c.strokeStyle=A(10,12,26);c.lineWidth=1.6;c.strokeRect(x-6,y-26,12,20);c.beginPath();c.moveTo(x,y-26);c.lineTo(x,y-6);c.stroke();
 c.fillStyle=A(10,12,26);c.beginPath();c.moveTo(x-10,y-26);c.lineTo(x,y-36);c.lineTo(x+10,y-26);c.closePath();c.fill();c.fillStyle=SN(.85);c.beginPath();c.ellipse(x-1,y-30,7,3.2,-.35,Math.PI,TAU);c.fill();
 add(()=>{ell(WARM,x,y-16,62,62,.55*fl);ell(WARM,x,y-16,16,16,.6*fl)})}
/* chimney smoke: puffs rising and leaning with the wind */
function smoke(x,y,t,ph,a,lean){add(()=>{c.fillStyle=FOG;for(let i=0;i<7;i++){const k=mod(t*.06+i/7+ph,1);c.globalAlpha=(a||.16)*Math.sin(k*Math.PI)*(1-k*.4);
  c.save();c.translate(x+k*(lean||60)+Math.sin(t*.5+i+ph)*6*k,y-k*150);c.scale(10+k*40,8+k*26);c.beginPath();c.arc(0,0,1,0,TAU);c.fill();c.restore()}})}

/* =================== the shared frame =================== */
function makeFrame(S,o){
 seed=S.seed;S.backG=lg(0,0,0,H,o.sky);
 const Lt=o.light;S.glowG=rg(Lt.x,Lt.y,6,Lt.r,Lt.c==='cy'?[A(190,240,255,1),A(90,170,230,.42),A(40,90,170,.14),A(20,40,90,0)]:Lt.c==='au'?[A(150,255,210,1),A(70,200,190,.4),A(30,110,140,.14),A(10,40,70,0)]:[MN(1),A(170,180,230,.45),A(90,100,170,.16),A(40,50,110,0)]);
 S.stars=[];for(let i=0;i<(o.stars||0);i++){const b=R()<.08;S.stars.push([rr(0,W),(R()**1.5)*(o.starY||300),b?rr(1.4,2.2):rr(.5,1.3),rr(0,TAU),b?rr(.8,1):rr(.3,.8),rr(.6,2.4)])}
 const sn=o.snow||{};S.wind=sn.wind===undefined?14:sn.wind;
 S.snow=[[100,.5,1.1,12,22,5,12],[60,1.1,1.9,26,40,10,20],[26,2.1,3.3,50,76,16,30]].map(L=>{const n=Math.round(L[0]*(sn.n||1)),a=[];for(let i=0;i<n;i++)a.push({x:rr(0,W+60),y:rr(0,H+40),r:rr(L[1],L[2]),v:rr(L[3],L[4])*(sn.v||1),a:rr(L[5],L[6]),f:rr(.4,1.1),ph:rr(0,TAU)});return a});
 S.ed=[0,1].map(s=>{const k=(o.edge||[])[s],e={ph:rr(0,TAU)};if(k)EDGE[k].init(e);return e});
 (o.shafts||[]).forEach(s=>{s.g=lg(0,s[5]||0,0,s[6]||FY,[MN(1),A(190,215,255,.45),A(160,190,255,0)])});
}
function glow(S,t){const Lt=S.o.light,fl=.94+.04*Math.sin(t*.6)+.02*Math.sin(t*1.7);
