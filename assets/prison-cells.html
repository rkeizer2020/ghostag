<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prison Backgrounds</title>
<style>
:root{--bg:#0b0c0e;--card:#121316;--line:#24262b;--fg:#e6e8ec;--muted:#9a9ea7;--dim:#6c7079;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.5;padding:28px 16px 48px;overflow-x:hidden}
header,main{max-width:1440px;margin-inline:auto}
header{margin-bottom:24px}
h1{font-size:clamp(24px,4vw,34px);font-weight:650;letter-spacing:.01em;margin:0 0 6px}
header p{margin:0;color:var(--muted);max-width:70ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));gap:20px}
figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
canvas{display:block;width:100%;aspect-ratio:16/9;background:#000}
figcaption{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px}
.t{display:flex;align-items:baseline;gap:10px;min-width:0}
.n{font-variant-numeric:tabular-nums;color:var(--dim);font-size:13px;font-weight:600;letter-spacing:.06em}
h2{font-size:16px;font-weight:600;margin:0;overflow-wrap:anywhere}
figcaption p{margin:0;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<header>
<h1>Prison Backgrounds</h1>
<p>Twenty painted, monochrome prison scenes for the side-scroller, each drawn live at 960&times;540 by the canvas engine below with slow fog, drifting dust and flickering light.</p>
</header>
<main><div class="grid" id="grid"></div></main>
<script>
/* ===== Prison area paintings: monochrome (black / grey / white, a breath of cold blue in the light) far backgrounds for the prison rooms ===== */
const PRISON=(()=>{
const W=960,H=540,TAU=Math.PI*2,FY=470;

let c=null;
let seed=1;const R=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};const rr=(a,b)=>a+R()*(b-a);
const lg=(x0,y0,x1,y1,st)=>{const g=c.createLinearGradient(x0,y0,x1,y1);st.forEach((s,i)=>g.addColorStop(i/(st.length-1),s));return g};
const rg=(x,y,r0,r1,st)=>{const g=c.createRadialGradient(x,y,r0,x,y,r1);st.forEach((s,i)=>g.addColorStop(i/(st.length-1),s));return g};
const blob=(pts,p)=>{p=p||c;if(p===c)c.beginPath();const n=pts.length;for(let i=0;i<=n;i++){const a=pts[i%n],q=pts[(i+1)%n],mx=(a[0]+q[0])/2,my=(a[1]+q[1])/2;i?p.quadraticCurveTo(a[0],a[1],mx,my):p.moveTo(mx,my)}p.closePath();return p};
const rock=(cx,cy,rx,ry,j,n)=>{const pts=[];n=n||11;for(let i=0;i<n;i++){const a=i/n*TAU,k=1+rr(-j,j);pts.push([cx+Math.cos(a)*rx*k,cy+Math.sin(a)*ry*k])}return pts};
const add=(f)=>{c.save();c.globalCompositeOperation='lighter';f();c.restore()};
/* greys: G(v,a) is a neutral grey with the faintest cold lift in blue; L(a) is the cold white of lamps and moonlight */
const G=(v,a)=>{v=v|0;return 'rgba('+v+','+v+','+Math.min(255,v+(v>>4)+2)+','+(a===undefined?1:a)+')'};
const L=(a)=>'rgba(222,230,242,'+a+')';
const P2=()=>new Path2D();
/* soft clouds: clusters of fog puffs */
const mkClouds=(n,y0,y1,a0,a1)=>{const out=[];for(let i=0;i<n;i++){const w=rr(110,220);out.push({x:rr(0,W+400),y:rr(y0,y1),s:rr(2,6),a:rr(a0,a1),pf:Array.from({length:5},()=>[rr(-w,w),rr(-12,10),rr(50,110),rr(14,30)])})}return out};
function clouds(list,t,span){add(()=>{c.fillStyle=FOG;for(const k of list){const x=((k.x+t*k.s)%(span||W+400))-200;c.globalAlpha=k.a;for(const p of k.pf){c.save();c.translate(x+p[0],k.y+p[1]);c.scale(p[2],p[3]);c.beginPath();c.arc(0,0,1,0,TAU);c.fill();c.restore()}}})}
const poly=(p,pts)=>{p.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)p.lineTo(pts[i][0],pts[i][1]);p.closePath();return p};
const seg=(p,a,b)=>{p.moveTo(a[0],a[1]);p.lineTo(b[0],b[1])};
/* a chain of links added to one path, so a whole chain is a single stroke */
const links=(p,x,y0,len,ry,sw)=>{for(let y=y0,k=0;y<y0+len;y+=ry*1.45,k++){const x2=x+sw*((y-y0)/len)**2;if(k%2){p.moveTo(x2,y-ry*.9);p.lineTo(x2,y+ry*.9)}else{p.moveTo(x2+ry*.52,y);p.ellipse(x2,y,ry*.52,ry,0,0,TAU)}}return p};
/* stone blocks: mortar lines, a few lighter and a few darker stones, all as Path2D built once */
function stones(x,y,w,h,bw,bh){const m=P2(),l=P2(),d=P2();
 for(let r=0,yy=y;yy<y+h;yy+=bh,r++){if(yy>y){m.moveTo(x,yy);m.lineTo(x+w,yy)}const y1=Math.min(yy+bh,y+h);let xx=x-(r%2?bw*.5:0)-rr(0,bw*.25);
  while(xx<x+w){const ww=bw*rr(.75,1.3);if(xx>x){m.moveTo(xx,yy);m.lineTo(xx,y1)}const x0=Math.max(x,xx),x1=Math.min(x+w,xx+ww),q=R();
   if(x1-x0>4){if(q<.2)l.rect(x0+1.5,yy+1.5,x1-x0-3,y1-yy-3);else if(q<.42)d.rect(x0+1.5,yy+1.5,x1-x0-3,y1-yy-3)}xx+=ww}}
 return {m,l,d}}
function drawStones(s,a,lw){c.fillStyle=G(220,.045*a);c.fill(s.l);c.fillStyle=G(0,.22*a);c.fill(s.d);c.strokeStyle=G(0,.55*a);c.lineWidth=lw||1.4;c.stroke(s.m);
 c.save();c.translate(0,1.4);c.strokeStyle=G(200,.05*a);c.lineWidth=1;c.stroke(s.m);c.restore()}

/* cached generic gradients (shape only; strength comes from globalAlpha) */
let FOG=null,DOT=null,VIG=null,FLOOR=null;
function caches(){if(FOG)return;FOG=rg(0,0,0,1,[G(205,1),G(190,.45),G(170,0)]);DOT=rg(0,0,0,1,[L(1),L(.25),L(0)]);
 VIG=rg(W/2,H*.48,H*.3,W*.72,[G(0,0),G(0,.35),G(0,.78)]);FLOOR=lg(0,FY-34,0,H,[G(4,0),G(4,.7),G(3,.94),G(2,.98)])}

/* =================== the shared frame =================== */
function makeFrame(S,o){
 seed=S.seed;
 S.wall=o.wall===false?null:stones(0,0,W,FY,o.bw||70,o.bh||34);
 S.motes=[];for(let i=0;i<(o.motes||64);i++)S.motes.push({x:rr(0,W),y:rr(0,H),r:rr(.7,2.2),s:rr(.08,.4),ph:rr(0,TAU)});
 const Lt=o.light;S.glowG=rg(Lt.x,Lt.y,10,Lt.r,[L(1),G(170,.5),G(110,.18),G(60,0)]);
 S.backG=lg(0,0,0,H,o.sky||[G(12),G(24),G(30),G(16),G(5)]);
 S.ed=[0,1].map(s=>{const e={w:rr(54,72),ph:rr(0,TAU),x1:rr(34,52),x2:rr(92,118),l1:rr(250,340),l2:rr(150,230)};
  e.st=stones(0,0,e.w,FY+60,e.w*.55,32);e.colG=lg(0,0,e.w+10,0,[G(4),G(17),G(24),G(9)]);return e});
 (o.shafts||[]).forEach(s=>{s.g=lg(0,s[5]||0,0,s[6]||FY,[L(1),L(.45),L(0)])});
}
function back(S){c.fillStyle=S.backG;c.fillRect(0,0,W,H);if(S.wall)drawStones(S.wall,S.o.wallA||1)}
function glow(S,t){const Lt=S.o.light,fl=.92+.05*Math.sin(t*1.3)+.03*Math.sin(t*5.3+Math.sin(t*1.7)*2);
 add(()=>{c.globalAlpha=Math.min(1,Lt.a*fl);c.fillStyle=S.glowG;c.fillRect(Math.max(0,Lt.x-Lt.r),Math.max(0,Lt.y-Lt.r),Math.min(W,Lt.r*2),Math.min(H,Lt.r*2))})}
function fog(t,y,a,sp,h){add(()=>{c.fillStyle=FOG;for(let i=0;i<4;i++){const x=((i*330+t*sp)%(W+520)+W+520)%(W+520)-260,yy=y+Math.sin(t*.2+i*2)*8;
  c.globalAlpha=a*(.8+.2*Math.sin(t*.3+i));c.save();c.translate(x,yy);c.scale(300,h||60);c.beginPath();c.arc(0,0,1,0,TAU);c.fill();c.restore()}})}
function shafts(S,t){const list=S.o.shafts;if(!list)return;add(()=>{for(const s of list){const [x0,w,ph,k,lean,y0,y1]=s,a=(.075+.035*Math.sin(t*.5+ph))*(k||1),sw=Math.sin(t*.2+ph)*10,yA=y0||0,yB=y1||FY;
  c.globalAlpha=a;c.fillStyle=s.g;c.beginPath();c.moveTo(x0-w*.5,yA);c.lineTo(x0+w*.5,yA);c.lineTo(x0+(lean||0)+w*1.5+sw,yB);c.lineTo(x0+(lean||0)-w*1.5+sw,yB);c.closePath();c.fill()}})}
function motes(S,t,dt){add(()=>{c.fillStyle=L(1);for(const m of S.motes){m.y-=m.s*dt*14;m.x+=Math.sin(t*.35+m.ph)*.12+.04;if(m.y<-5){m.y=H+5;m.x=Math.random()*W}if(m.x>W+5)m.x=-5;
  const a=.22+.22*Math.sin(t*1.2+m.ph);c.globalAlpha=a*.35;c.beginPath();c.arc(m.x,m.y,m.r*2.6,0,TAU);c.fill();c.globalAlpha=a;c.beginPath();c.arc(m.x,m.y,m.r*.7,0,TAU);c.fill()}})}
function floorShade(){c.fillStyle=FLOOR;c.fillRect(0,FY-34,W,H-FY+34)}
function vignette(){c.fillStyle=VIG;c.fillRect(0,0,W,H)}
/* near foreground silhouettes at the left/right edges (the right one is the mirror image) */
const EDGE={
 column(S,t,e){c.fillStyle=e.colG;c.fillRect(0,0,e.w,H);drawStones(e.st,1.3,1.6);
  c.fillStyle=lg(e.w-12,0,e.w,0,[G(160,0),G(170,.14)]);c.fillRect(e.w-12,0,12,FY);
  c.fillStyle=G(6);c.fillRect(0,0,e.w+18,30);c.fillRect(0,30,e.w+10,10);c.fillStyle=G(150,.16);c.fillRect(0,39,e.w+10,2);
  c.fillStyle=lg(e.w+10,0,e.w+70,0,[G(0,.45),G(0,0)]);c.fillRect(e.w+10,0,60,H)},
 bars(S,t,e){c.fillStyle=lg(0,0,170,0,[G(0,.55),G(0,0)]);c.fillRect(0,0,170,H);c.fillStyle=G(5);c.fillRect(0,0,150,22);
  for(const [x,w] of[[14,20],[66,15],[112,11]]){c.fillStyle=lg(x,0,x+w,0,[G(3),G(16),G(5)]);c.fillRect(x,0,w,H);c.fillStyle=G(170,.16);c.fillRect(x+w*.62,22,1.5,FY-22)}
  for(const y of[110,360]){c.fillStyle=G(5);c.fillRect(0,y,140,13);c.fillStyle=G(170,.14);c.fillRect(0,y,140,1.5);c.fillStyle=G(90,.5);for(const x of[24,73,117]){c.beginPath();c.arc(x,y+6.5,2.2,0,TAU);c.fill()}}},
 chain(S,t,e){const sw=Math.sin(t*.55+e.ph)*5;c.lineCap='round';
  for(const [x,len,ry,lw] of[[e.x1,e.l1,14,5],[e.x2,e.l2,10,3.6]]){const p=links(P2(),x,-10,len,ry,sw);c.strokeStyle=G(6);c.lineWidth=lw;c.stroke(p);c.save();c.translate(-1,-1);c.strokeStyle=G(170,.14);c.lineWidth=1.2;c.stroke(p);c.restore();
   const ex=x+sw,ey=len-10;c.strokeStyle=G(6);c.lineWidth=lw*1.3;c.beginPath();c.arc(ex,ey+ry*1.4,ry*1.2,-1.2,Math.PI+1.2,false);c.stroke()}
  c.lineCap='butt'},
 post(S,t,e){c.fillStyle=lg(0,0,64,0,[G(4),G(16),G(6)]);c.fillRect(22,0,30,H);c.fillStyle=G(160,.14);c.fillRect(46,0,2,FY);
  c.fillStyle=G(5);c.fillRect(16,0,42,12);c.strokeStyle=G(8,.95);c.lineWidth=2;c.beginPath();for(const y of[300,350,400]){c.moveTo(-10,y);c.quadraticCurveTo(70,y+16+Math.sin(t*.7+y)*1.5,180,y+6)}c.moveTo(180,306);c.quadraticCurveTo(190,330,184,352+Math.sin(t*.9)*3);c.stroke();
  c.lineWidth=1.6;c.beginPath();for(const y of[300,350,400])for(let x=72;x<180;x+=30){const yy=y+12;c.moveTo(x-4,yy-4);c.lineTo(x+4,yy+4);c.moveTo(x+4,yy-4);c.lineTo(x-4,yy+4)}c.stroke()},
 pipe(S,t,e){c.fillStyle=lg(8,0,62,0,[G(5),G(30),G(46),G(12)]);c.fillRect(8,0,54,H);c.fillStyle=G(6);for(let y=60;y<H;y+=150){c.fillRect(2,y,66,16);c.fillStyle=G(150,.16);c.fillRect(2,y,66,1.5);c.fillStyle=G(6)}
  c.fillStyle=lg(62,0,120,0,[G(0,.45),G(0,0)]);c.fillRect(62,0,60,H)},
 bent(S,t,e){c.fillStyle=lg(0,0,190,0,[G(0,.55),G(0,0)]);c.fillRect(0,0,190,H);c.fillStyle=G(5);c.fillRect(0,0,180,22);
  c.lineCap='round';for(const [x,w,b] of[[22,18,0],[78,14,1],[128,11,0]]){c.strokeStyle=G(6);c.lineWidth=w;c.beginPath();c.moveTo(x,0);if(b){c.lineTo(x,150);c.bezierCurveTo(x,240,x+70,250,x+64,330);c.lineTo(x+10,FY+60)}else c.lineTo(x,H);c.stroke();
   c.strokeStyle=G(170,.13);c.lineWidth=1.5;c.beginPath();c.moveTo(x+w*.2,24);if(b){c.lineTo(x+w*.2,150);c.bezierCurveTo(x+w*.2,240,x+70+w*.2,250,x+64+w*.2,330)}else c.lineTo(x+w*.2,FY);c.stroke()}
  c.lineCap='butt';c.fillStyle=G(5);c.fillRect(0,120,160,12)}
};
function edges(S,t){const e=S.o.edge||['column','column'];for(let s=0;s<2;s++){const k=e[s];if(!k)continue;c.save();if(s){c.translate(W,0);c.scale(-1,1)}EDGE[k](S,t,S.ed[s]);c.restore()}
 if(S.o.beam){c.fillStyle=lg(0,0,0,34,[G(3),G(12)]);c.fillRect(0,0,W,30);c.fillStyle=G(160,.12);c.fillRect(0,29,W,1.5);c.fillStyle=G(80,.5);for(let x=20;x<W;x+=46){c.beginPath();c.arc(x,15,2.2,0,TAU);c.fill()}}}
/* lantern: small cage lamp, used in several scenes */
function lamp(x,y,s,t,ph,a){const fl=.85+.1*Math.sin(t*2.1+ph)+.05*Math.sin(t*9.7+ph*3);add(()=>{c.globalAlpha=(a||.6)*fl;c.fillStyle=DOT;c.save();c.translate(x,y);c.scale(70*s,70*s);c.beginPath();c.arc(0,0,1,0,TAU);c.fill();c.restore();
  c.globalAlpha=fl;c.fillStyle=L(.9);c.beginPath();c.arc(x,y,4*s,0,TAU);c.fill()});
 c.strokeStyle=G(8);c.lineWidth=1.6*s;c.beginPath();c.moveTo(x-6*s,y-8*s);c.lineTo(x+6*s,y-8*s);c.lineTo(x+5*s,y+7*s);c.lineTo(x-5*s,y+7*s);c.closePath();c.moveTo(x,y-8*s);c.lineTo(x,y+7*s);c.stroke()}
/* cell door: dark opening with bars, as paths */
function cellDoor(pd,pb,x,y,w,h,n){pd.rect(x,y,w,h);for(let i=1;i<n;i++){const xx=x+w*i/n;pb.moveTo(xx,y);pb.lineTo(xx,y+h)}pb.moveTo(x,y+h*.2);pb.lineTo(x+w,y+h*.2);pb.moveTo(x,y+h*.75);pb.lineTo(x+w,y+h*.75)}
/* perspective helper */
const persp=(vx,vy)=>(X,Y,z)=>[vx+(X-vx)/z,vy+(Y-vy)/z];
const lerpZ=(z0,z1,k)=>1/(1/z0+(1/z1-1/z0)*k);

/* =================== the middle of each scene =================== */
const MID={
 /* 1: a long cell block corridor, barred cells on both sides receding to a lit gate */
 corridor:{init(S){seed=S.seed+5;const P=persp(480,240),XL=70,XR=890,YT=6,YB=FY,ZF=7.2;
   S.wl=poly(P2(),[P(XL,YT,1),P(XL,YT,ZF),P(XL,YB,ZF),P(XL,YB,1)]);S.wr=poly(P2(),[P(XR,YT,1),P(XR,YT,ZF),P(XR,YB,ZF),P(XR,YB,1)]);
   S.ceil=poly(P2(),[P(XL,YT,1),P(XR,YT,1),P(XR,YT,ZF),P(XL,YT,ZF)]);S.flr=poly(P2(),[P(XL,YB,1),P(XR,YB,1),P(XR,YB,ZF),P(XL,YB,ZF)]);
   const e=P(XL,YT,ZF),f=P(XR,YB,ZF);S.end=[e[0],e[1],f[0]-e[0],f[1]-e[1]];
   S.wlG=lg(XL,0,e[0],0,[G(14),G(30),G(52)]);S.wrG=lg(XR,0,f[0],0,[G(14),G(30),G(52)]);S.cG=lg(0,0,0,e[1],[G(3),G(10),G(34)]);S.fG=lg(0,FY,0,f[1],[G(8),G(22),G(48)]);
   S.mort=P2();for(let Y=YT+34;Y<YB;Y+=34)for(const X of[XL,XR])seg(S.mort,P(X,Y,1),P(X,Y,ZF));
   for(let k=0;k<=24;k++){const z=lerpZ(1,ZF,k/24);seg(S.mort,P(XL,YT,z),P(XR,YT,z))}
   const zs=[1.08,1.4,1.82,2.36,3.05,3.9,5.0,6.4];S.cells=[];S.dk=P2();S.walk=P2();
   for(const X of[XL,XR]){for(let i=0;i<zs.length-1;i++){const z0=zs[i]*1.045,z1=zs[i+1]*.965,top=150,b=P2();
     poly(S.dk,[P(X,top,z0),P(X,top,z1),P(X,YB,z1),P(X,YB,z0)]);
     for(let k=0;k<=8;k++){const z=lerpZ(z0,z1,k/8);seg(b,P(X,top,z),P(X,YB,z))}for(const Y of[top+6,230,410])seg(b,P(X,Y,z0),P(X,Y,z1));
     S.cells.push({b,lw:Math.max(1,5.2/zs[i]),lit:R()<.3,c:P(X,300,(z0+z1)/2),r:110/zs[i]})}
    poly(S.walk,[P(X,96,1),P(X,96,ZF),P(X,112,ZF),P(X,112,1)])}
   S.rail=P2();for(const X of[XL,XR]){const Xi=X+(X<480?40:-40);seg(S.rail,P(Xi,62,1),P(Xi,62,ZF));seg(S.rail,P(Xi,96,1),P(Xi,96,ZF));for(let k=0;k<=40;k++){const z=lerpZ(1,ZF,k/40);seg(S.rail,P(Xi,62,z),P(Xi,96,z))}
    poly(S.walk,[P(X,96,1),P(Xi,96,1),P(Xi,96,ZF),P(X,96,ZF)])}
   S.gate=P2();const [gx,gy,gw,gh]=S.end;for(let i=1;i<9;i++)seg(S.gate,[gx+gw*i/9,gy],[gx+gw*i/9,gy+gh]);seg(S.gate,[gx,gy+gh*.3],[gx+gw,gy+gh*.3]);
   S.lamps=[1.55,2.5,3.7,5.4].map(z=>({z,p:P(480,150,z),top:P(480,YT,z),ph:rr(0,TAU),pool:P(480,YB,z)}));S.endG=lg(0,gy,0,gy+gh,[L(.9),L(.6),G(140,.5)])},
  draw(S,t){c.fillStyle=S.cG;c.fill(S.ceil);c.fillStyle=S.fG;c.fill(S.flr);c.fillStyle=S.wlG;c.fill(S.wl);c.fillStyle=S.wrG;c.fill(S.wr);c.strokeStyle=G(0,.4);c.lineWidth=1.2;c.stroke(S.mort);
   const [gx,gy,gw,gh]=S.end;c.fillStyle=S.endG;c.fillRect(gx,gy,gw,gh);c.strokeStyle=G(20,.9);c.lineWidth=2;c.stroke(S.gate);
   c.fillStyle=G(3,.96);c.fill(S.dk);
   add(()=>{for(const s of S.cells)if(s.lit){c.globalAlpha=.22+.05*Math.sin(t*.8+s.r);c.fillStyle=DOT;c.save();c.translate(s.c[0],s.c[1]);c.scale(s.r*.5,s.r);c.beginPath();c.arc(0,0,1,0,TAU);c.fill();c.restore()}});
